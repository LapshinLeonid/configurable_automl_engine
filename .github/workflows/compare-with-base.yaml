name: Compare with base

# Differential behavior check instead of stored snapshots: the same
# scenarios run on the base commit (merge-base with main, or HEAD^ on main)
# and on this commit, with the same interpreter and libraries; any
# difference in results, exceptions, logs, the config schema or the
# loading of a base-saved model fails the job.
#
# Optional: it does not run on every push or pull request. Run it
#   - from the Actions tab ("Run workflow", optionally with a base ref), or
#   - on a pull request by adding the `compare-with-base` label.
# A change that alters the config schema or the results on purpose fails
# it by design, so it is a review aid, not a merge gate.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to compare with (default: merge-base with origin/main)"
        required: false
        default: ""
  pull_request:
    types: [labeled]

jobs:
  compare-with-base:
    name: Compare behavior with the base commit
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'compare-with-base'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: Compare with the base commit
        env:
          BASE_REF: ${{ inputs.base }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/compare_with_base.py --base "$BASE_REF"
          else
            python scripts/compare_with_base.py
          fi
