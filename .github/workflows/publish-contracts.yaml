name: Publish configurable-automl-contracts to PyPI

# The contract has its own release line. A `contracts-v*` tag is synced from
# SourceCraft to GitHub; this workflow runs the release gates, builds the exact
# artifacts, publishes them to public PyPI with Trusted Publishing and installs
# the published distribution back as an external consumer.
on:
  push:
    tags:
      - "contracts-v*"

concurrency:
  group: publish-contracts-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish configurable-automl-contracts release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          pip install -e configurable-automl-contracts
          pip install ruff mypy types-PyYAML pyyaml pytest pytest-mock pytest-cov import-linter==2.15 "jsonschema>=4.18" packaging build twine

      - name: Check the release tag
        run: |
          set -euo pipefail
          VERSION=$(python scripts/contract_release.py check-tag \
            --tag "${GITHUB_REF_NAME}" \
            --pyproject configurable-automl-contracts/pyproject.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Run release quality gates
        run: |
          set -euo pipefail
          python scripts/check_contract_boundaries.py
          python scripts/check_release_configuration.py
          ruff check src/ configurable-automl-contracts/src/
          ruff format --check src/ configurable-automl-contracts/src/
          ruff check scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
          ruff format --check scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
          mypy scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
          (cd configurable-automl-contracts && mypy src)
          (cd configurable-automl-contracts && lint-imports)
          python -m pytest tests/contracts

      - name: Build and verify the distribution
        run: |
          set -euo pipefail
          rm -rf configurable-automl-contracts/dist configurable-automl-contracts/build configurable-automl-contracts/src/*.egg-info
          python -m build configurable-automl-contracts --outdir configurable-automl-contracts/dist
          CONTRACT_WHEEL=$(ls configurable-automl-contracts/dist/*.whl | head -1)
          CONTRACT_SDIST=$(ls configurable-automl-contracts/dist/*.tar.gz | head -1)
          twine check "$CONTRACT_WHEEL" "$CONTRACT_SDIST"
          python scripts/verify_contract_distribution.py \
            --contract-wheel "$CONTRACT_WHEEL" \
            --contract-sdist "$CONTRACT_SDIST" \
            --expected-version "$VERSION"

      - name: Install the exact artifact in a clean environment
        run: |
          set -euo pipefail
          rm -rf /tmp/publish-venv
          python -m venv /tmp/publish-venv
          /tmp/publish-venv/bin/pip install --upgrade pip
          /tmp/publish-venv/bin/pip install --index-url https://pypi.org/simple "pydantic>=2.12.5,<3" "pydantic-core>=2,<3"
          CONTRACT_WHEEL=$(ls configurable-automl-contracts/dist/*.whl | head -1)
          /tmp/publish-venv/bin/pip install --no-deps "$CONTRACT_WHEEL"
          /tmp/publish-venv/bin/python scripts/smoke_contract_install.py
          /tmp/publish-venv/bin/pip check

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: configurable-automl-contracts/dist

      - name: Verify installation from PyPI
        run: |
          set -euo pipefail
          rm -rf /tmp/pypi-verify-venv /tmp/pypi-verify-consumer
          python -m venv /tmp/pypi-verify-venv
          PIP_CONFIG_FILE=/dev/null /tmp/pypi-verify-venv/bin/pip install --isolated --upgrade pip
          for attempt in 1 2 3 4 5 6; do
            if PIP_CONFIG_FILE=/dev/null /tmp/pypi-verify-venv/bin/pip install \
              --isolated \
              --index-url https://pypi.org/simple \
              --disable-pip-version-check \
              --no-cache-dir \
              --retries 5 \
              --timeout 60 \
              "configurable-automl-contracts==${VERSION}"; then
              installed=1
              break
            fi
            echo "PyPI is not serving configurable-automl-contracts ${VERSION} yet; retrying..."
            sleep 10
          done
          test "${installed:-0}" = "1"
          /tmp/pypi-verify-venv/bin/python scripts/smoke_contract_install.py
          /tmp/pypi-verify-venv/bin/pip check
          PIP_CONFIG_FILE=/dev/null /tmp/pypi-verify-venv/bin/pip install \
            --isolated --index-url https://pypi.org/simple "jsonschema>=4.18" packaging
          mkdir -p /tmp/pypi-verify-consumer
          cd /tmp/pypi-verify-consumer
          /tmp/pypi-verify-venv/bin/python "$GITHUB_WORKSPACE/scripts/e2e_contract_consumer.py" \
            --expected-version "$VERSION" \
            --reference-config "$GITHUB_WORKSPACE/tests/contracts/data/reference_config.json" \
            --forbid-source-root "$GITHUB_WORKSPACE"

      - name: Verify sdist installation from PyPI
        run: |
          set -euo pipefail
          rm -rf /tmp/pypi-sdist-venv /tmp/pypi-sdist-consumer
          python -m venv /tmp/pypi-sdist-venv
          PIP_CONFIG_FILE=/dev/null /tmp/pypi-sdist-venv/bin/pip install --isolated --upgrade pip
          for attempt in 1 2 3 4 5 6; do
            if PIP_CONFIG_FILE=/dev/null /tmp/pypi-sdist-venv/bin/pip install \
              --isolated \
              --index-url https://pypi.org/simple \
              --disable-pip-version-check \
              --no-cache-dir \
              --no-binary configurable-automl-contracts \
              --retries 5 \
              --timeout 60 \
              "configurable-automl-contracts==${VERSION}"; then
              installed=1
              break
            fi
            echo "PyPI is not serving the configurable-automl-contracts ${VERSION} source distribution yet; retrying..."
            sleep 10
          done
          test "${installed:-0}" = "1"
          /tmp/pypi-sdist-venv/bin/python scripts/smoke_contract_install.py
          /tmp/pypi-sdist-venv/bin/pip check
          PIP_CONFIG_FILE=/dev/null /tmp/pypi-sdist-venv/bin/pip install \
            --isolated --index-url https://pypi.org/simple "jsonschema>=4.18" packaging
          mkdir -p /tmp/pypi-sdist-consumer
          cd /tmp/pypi-sdist-consumer
          /tmp/pypi-sdist-venv/bin/python "$GITHUB_WORKSPACE/scripts/e2e_contract_consumer.py" \
            --expected-version "$VERSION" \
            --reference-config "$GITHUB_WORKSPACE/tests/contracts/data/reference_config.json" \
            --forbid-source-root "$GITHUB_WORKSPACE"
