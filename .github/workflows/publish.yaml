name: Publish to PyPI

# Запускается ТОЛЬКО когда вы публикуете релиз через интерфейс GitHub
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    
    # Права для безопасной OIDC-аутентификации (Trusted Publishers)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypiauth@release/v1