name: Publish to PyPI

# Runs ONLY when you publish a release through the GitHub interface
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    
    # Permissions for secure OIDC authentication (Trusted Publishers)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1