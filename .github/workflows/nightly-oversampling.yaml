name: Nightly Oversampling Benchmarks

on:
  schedule:
    # Nightly at 03:17 UTC — the evidence gate (T13) is a nightly check.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  oversampling:
    name: Run oversampling evidence benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e ".[all,test]"; fi

      # Oversampling evidence benchmark (the nightly gate T13). Compares the
      # median held-out R² with oversampling disabled vs enabled (random /
      # smote / adasyn) and reports a violation when any algorithm degrades
      # the median R² by more than 0.01 — the signal to mark the feature
      # experimental in README/API_REFERENCE.
      - name: Run Oversampling evidence benchmark
        env:
          PYTHONPATH: .
        run: python benchmarks/run_oversampling_benchmark.py