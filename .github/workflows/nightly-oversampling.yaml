name: Oversampling Benchmarks

# Manual only: the nightly schedule is disabled. The feature is marked
# experimental in README/API_REFERENCE, so the gate failing every night
# carries no new signal. Run it from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  oversampling:
    name: Run oversampling evidence benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e ".[all,test]"; fi

      # Oversampling evidence benchmark (the evidence gate T13). Compares the
      # median held-out R² with oversampling disabled vs enabled (random /
      # smote / adasyn) and reports a violation when any algorithm degrades
      # the median R² by more than 0.01 — the signal to mark the feature
      # experimental in README/API_REFERENCE.
      - name: Run Oversampling evidence benchmark
        env:
          PYTHONPATH: .
        run: python benchmarks/run_oversampling_benchmark.py