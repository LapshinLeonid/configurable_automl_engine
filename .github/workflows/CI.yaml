name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov "coverage>=7.10.6" pytest-mock ruff mypy types-PyYAML pyyaml import-linter==2.15
          # Install the project itself in "editable" mode so it is visible as a package
          # This works if there is a setup.py or pyproject.toml at the repository root
          pip install -e configurable-automl-contracts
          if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e ".[all,test]"; fi

      - name: Check contract architecture boundaries
        run: python scripts/check_contract_boundaries.py

      - name: Lint with Ruff
        run: ruff check src/ configurable-automl-contracts/src/

      - name: Check formatting with Ruff
        run: ruff format --check src/ configurable-automl-contracts/src/

      # Import layers: training_engine -> hpo/tuner/trainer -> building
      # blocks -> common (contracts in pyproject.toml, no allowlist).
      - name: Check import layers
        run: |
          lint-imports
          (cd configurable-automl-contracts && lint-imports)

      - name: Type check with Mypy
        run: |
          mypy src --install-types --non-interactive
          (cd configurable-automl-contracts && mypy src)

      - name: Run tests
        env:
          PYTHONPATH: .
          AUTOML_RUN_NETWORK_TESTS: "1"
        run: coverage run --parallel-mode -m pytest

      # Parallel coverage data from the main process, threads and the
      # subprocesses started by the worker pool must be merged before the
      # report is produced and the 90% threshold is enforced.
      - name: Combine coverage data
        run: coverage combine

      - name: Report coverage
        run: coverage report

      - name: Write coverage XML
        run: coverage xml

      # The engine must work with the contract installed from the built wheel,
      # and every documented legacy public import path must stay available.
      - name: Verify the engine against the built contract wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          set -euo pipefail
          python -m pip install build
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('configurable-automl-contracts/pyproject.toml', 'rb'))['project']['version'])")
          rm -rf configurable-automl-contracts/dist dist/engine
          python -m build configurable-automl-contracts --outdir configurable-automl-contracts/dist
          python -m build . --outdir dist/engine
          python -m pip install --force-reinstall --no-deps configurable-automl-contracts/dist/*.whl
          python -m pip install --force-reinstall --no-deps dist/engine/*.whl
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/smoke_engine_install.py" \
            --expected-contract-version "$VERSION" \
            --import-matrix "$GITHUB_WORKSPACE/tests/engine/golden/import_matrix.json" \
            --forbid-source-root "$GITHUB_WORKSPACE"

      # Regression benchmark of the Sanity Gate on the target pipeline — a mandatory
      # gate. Compares pipeline variants (baseline:
      # all_algorithms + select(cv_best, winner); target:
      # all_algorithms + select(sanity_gate, top_k) + refine +
      # select(sanity_gate, winner)), prints the table
      # «dataset x variant x winner x gate» and blocks the run when the
      # thresholds are violated: 0 winner changes on reference datasets,
      # 100% changes on degenerate ones.
      - name: Run Sanity Gate pipeline-variant benchmark
        env:
          PYTHONPATH: .
        run: python benchmarks/run_sanity_gate_benchmark.py

      # Regression benchmark of the BBC-CV estimate after adaptive HPO — a
      # mandatory gate. On synthetic datasets with a known quality ceiling
      # (linear ridge cases + the signal-free case) it runs the full
      # adaptive HPO (Optuna), computes bbc_cv_score over the trial OOF
      # matrix, and compares it with a repeated external hold-out of the
      # SELECTED configuration on fresh data. Blocks the run when the
      # thresholds are violated: |median gap (BBC-CV − external)| > 0.025
      # for the pooled per-case seed set, or a positive BBC-CV estimate on
      # the signal-free case (pure selection bias).
      - name: Run BBC-CV after-adaptive-HPO benchmark
        env:
          PYTHONPATH: .
        run: python benchmarks/run_bbc_adaptive_hpo_benchmark.py --ci

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The published package declares Python 3.11-3.14. Every push and pull
  # request runs the fast subset on each supported interpreter; a release
  # tag runs the full suite on all of them before the release can publish.
  versions:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e configurable-automl-contracts
          pip install -e ".[all,test]"

      # Import contracts, static structure checks and model construction are
      # cheap and fail fast when an interpreter is not supported.
      - name: Run the fast test subset
        if: github.ref_type != 'tag'
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_import_layers.py
          tests/test_import_side_effects.py
          tests/test_module_structure.py
          tests/test_models.py
          tests/engine/test_contract_compatibility.py

      - name: Run the full test suite for a release
        if: github.ref_type == 'tag'
        env:
          PYTHONPATH: .
          AUTOML_RUN_NETWORK_TESTS: "1"
        run: pytest

  # The contract is independent from the engine: it is checked, built and
  # installed in a clean environment without the engine runtime packages.
  contracts:
    name: Contract distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install contract and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e configurable-automl-contracts pytest pytest-mock ruff mypy types-PyYAML pyyaml import-linter==2.15 build twine "jsonschema>=4.18" packaging

      - name: Run static boundary and release configuration guards
        run: |
          python scripts/check_contract_boundaries.py
          python scripts/check_release_configuration.py

      - name: Run contract quality checks
        run: |
          ruff check src/ configurable-automl-contracts/src/
          ruff format --check src/ configurable-automl-contracts/src/
          ruff check tools/contract_boundaries.py tools/__init__.py scripts/check_contract_boundaries.py scripts/verify_contract_distribution.py scripts/smoke_contract_install.py scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py tests/contracts/test_architecture_guarantees.py tests/contracts/test_release_pipeline.py tests/contracts/test_release_configuration.py
          ruff format --check tools/contract_boundaries.py tools/__init__.py scripts/check_contract_boundaries.py scripts/verify_contract_distribution.py scripts/smoke_contract_install.py scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py tests/contracts/test_architecture_guarantees.py tests/contracts/test_release_pipeline.py tests/contracts/test_release_configuration.py
          mypy tools/contract_boundaries.py scripts/check_contract_boundaries.py scripts/verify_contract_distribution.py scripts/smoke_contract_install.py scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
          (cd configurable-automl-contracts && mypy src)
          (cd configurable-automl-contracts && lint-imports)
          python -m pytest tests/contracts

      - name: Build and verify contract artifacts
        run: |
          rm -rf configurable-automl-contracts/dist
          python -m build configurable-automl-contracts --outdir configurable-automl-contracts/dist
          twine check configurable-automl-contracts/dist/*
          python scripts/verify_contract_distribution.py \
            --contract-wheel configurable-automl-contracts/dist/*.whl \
            --contract-sdist configurable-automl-contracts/dist/*.tar.gz

      - name: Install contract in a clean environment
        run: |
          rm -rf /tmp/contracts-venv
          python -m venv /tmp/contracts-venv
          /tmp/contracts-venv/bin/pip install --upgrade pip
          /tmp/contracts-venv/bin/pip install configurable-automl-contracts/dist/*.whl
          /tmp/contracts-venv/bin/python scripts/smoke_contract_install.py
          /tmp/contracts-venv/bin/pip check
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('configurable-automl-contracts/pyproject.toml', 'rb'))['project']['version'])")
          /tmp/contracts-venv/bin/pip install --index-url https://pypi.org/simple "jsonschema>=4.18" packaging
          cd /tmp
          /tmp/contracts-venv/bin/python "$GITHUB_WORKSPACE/scripts/e2e_contract_consumer.py" \
            --expected-version "$VERSION" \
            --reference-config "$GITHUB_WORKSPACE/tests/contracts/data/reference_config.json" \
            --forbid-source-root "$GITHUB_WORKSPACE"

      - name: Build engine artifacts without contract sources
        run: |
          rm -rf dist/engine
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0 python -m build . --outdir dist/engine
          python scripts/verify_contract_distribution.py \
            --engine-wheel dist/engine/*.whl \
            --engine-sdist dist/engine/*.tar.gz

  # The process-pool machinery depends on the interpreter: Python 3.14
  # changed the default POSIX start method and added the public
  # ProcessPoolExecutor.terminate_workers() / kill_workers(). The parallel
  # and safety-net tests run on the oldest and the newest supported version.
  parallel:
    name: Parallel tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e configurable-automl-contracts
          pip install -e ".[all,test]"

      - name: Run the parallel and safety-net tests
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_parallel.py
          tests/test_parallel_behavior.py
          tests/test_parallel_deadlines.py
          tests/test_parallel_logging.py
          tests/test_parallel_orchestrator.py
          tests/test_parallel_supervisor.py
          tests/test_refactor_safety_net.py
