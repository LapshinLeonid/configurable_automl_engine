name: CI

on: 
  push

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock ruff mypy types-PyYAML
          # Устанавливаем сам проект в "редактируемом" режиме, чтобы он был виден как пакет
          # Это сработает, если у вас в корне есть setup.py или pyproject.toml
          if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e ".[all,test]"; fi

      - name: Lint with Ruff
        run: ruff check src/

      - name: Type check with Mypy
        run: mypy src --install-types --non-interactive

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest --cov=src --cov-report=xml

      # R4 (issue #78): регрессионный бенчмарк Sanity Gate на целевом пайплайне
      # эпика #74 — обязательный критерий приёмки эпика. Сравнивает варианты
      # пайплайна (baseline: all_algorithms + select(cv_best, winner); target:
      # all_algorithms + select(sanity_gate, top_k) + refine +
      # select(sanity_gate, winner)), печатает таблицу
      # «датасет × вариант × победитель × гейт» и блокирует приёмку при
      # нарушении порогов: 0 изменений победителя на эталонных датасетах,
      # 100% изменений на вырожденных.
      - name: Run Sanity Gate pipeline-variant benchmark
        env:
          PYTHONPATH: .
        run: python benchmarks/run_sanity_gate_benchmark.py

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}