name: CI

on: 
  push

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock ruff mypy types-PyYAML import-linter==2.15
          # Install the project itself in "editable" mode so it is visible as a package
          # This works if there is a setup.py or pyproject.toml at the repository root
          if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e ".[all,test]"; fi

      - name: Lint with Ruff
        run: ruff check src/

      - name: Check formatting with Ruff
        run: ruff format --check src/

      # Import layers: training_engine -> hpo/tuner/trainer -> building
      # blocks -> common (contracts in pyproject.toml, no allowlist).
      - name: Check import layers
        run: lint-imports

      - name: Type check with Mypy
        run: mypy src --install-types --non-interactive

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest --cov=src --cov-report=xml

      # Regression benchmark of the Sanity Gate on the target pipeline — a mandatory
      # gate. Compares pipeline variants (baseline:
      # all_algorithms + select(cv_best, winner); target:
      # all_algorithms + select(sanity_gate, top_k) + refine +
      # select(sanity_gate, winner)), prints the table
      # «dataset x variant x winner x gate» and blocks the run when the
      # thresholds are violated: 0 winner changes on reference datasets,
      # 100% changes on degenerate ones.
      - name: Run Sanity Gate pipeline-variant benchmark
        env:
          PYTHONPATH: .
        run: python benchmarks/run_sanity_gate_benchmark.py

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The process-pool machinery depends on the interpreter: Python 3.14
  # changed the default POSIX start method and added the public
  # ProcessPoolExecutor.terminate_workers() / kill_workers(). The parallel
  # and safety-net tests run on the oldest and the newest supported version.
  parallel:
    name: Parallel tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: Run the parallel and safety-net tests
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_parallel.py
          tests/test_parallel_behavior.py
          tests/test_parallel_deadlines.py
          tests/test_parallel_logging.py
          tests/test_parallel_orchestrator.py
          tests/test_parallel_supervisor.py
          tests/test_refactor_safety_net.py

  # Differential behavior check instead of stored snapshots: the same
  # scenarios run on the base commit (merge-base with main, or HEAD^ on main)
  # and on this commit, with the same interpreter and libraries; any
  # difference in results, exceptions, logs, the config schema or the
  # loading of a base-saved model fails the job.
  compare-with-base:
    name: Compare behavior with the base commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: Compare with the base commit
        run: python scripts/compare_with_base.py
