[build-system]
requires = ["setuptools>=64","setuptools-scm>=10.3.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configurable-automl-engine"              # PyPI name (may differ from the module name)
dynamic = ["version"]
description = "A configuration-driven AutoML orchestrator for tabular regression: automated model selection and multi-step hyperparameter optimization."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
{ name = "Leonid Lapshin", email = "leonid.lapshin.a@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "imbalanced-learn>=0.13.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "scipy>=1.11.4",
    "optuna>=3.1.0",
    "pydantic>=2.12.5",
    "pyarrow>=14.0.0",
    "configurable-automl-contracts>=0.2.0,<0.3.0",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "machine-learning",
    "data-science",
    "data-analysis"
]

[project.optional-dependencies]

xgboost = ["xgboost>=3.1.3"]

logging = ["concurrent-log-handler>=0.9.25"]

mlflow = ["mlflow>=2.0.0"]

shap = ["shap>=0.48.0"]

test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.14.0",
    "pytest-cov>=7.0",
    "coverage>=7.10.6",
    "import-linter==2.15",
    "jsonschema>=4.18",
    "mypy>=1.13",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12",
    "pandas-stubs>=3.0.0",
    "scipy-stubs>=1.17.0",
    "configurable-automl-engine[xgboost]",
]

all = ["configurable-automl-engine[xgboost,logging,mlflow,shap]"]

dev = ["configurable-automl-engine[all,test]"]

[project.urls]
Homepage = "https://github.com/LapshinLeonid/configurable_automl_engine"
Issues = "https://github.com/LapshinLeonid/configurable_automl_engine/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["configurable_automl_engine*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/configurable_automl_engine/_version.py"

# Only engine tags participate in version inference. The contract release line
# uses contracts-v<version> tags, and a contract tag at HEAD must not be parsed
# as an engine version.
[tool.setuptools_scm.tag]
prefix = "v"
regex = "^(?P<version>\\d+\\.\\d+\\.\\d+.*)$"

[tool.setuptools.package-data]
configurable_automl_engine = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/configurable_automl_engine/_version.py"]

[tool.ruff.lint]
extend-select = ["C901", "B904", "B905", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# ``X as X`` marks an explicit re-export for mypy (strict mode disables
# implicit re-exports), while the import path stays the documented one.
"src/configurable_automl_engine/models.py" = ["PLC0414"]
"src/configurable_automl_engine/hpo/request.py" = ["PLC0414"]
"src/configurable_automl_engine/hpo/types.py" = ["PLC0414"]
"src/configurable_automl_engine/training_engine/config_parser.py" = ["PLC0414"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*",
    "imblearn",
    "imblearn.*",
    "concurrent_log_handler.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "configurable_automl_engine"
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: training_engine -> engines -> building blocks -> common"
type = "layers"
containers = ["configurable_automl_engine"]
# Every module of the package must be assigned to a layer.
exhaustive = true
layers = [
    # 3 — orchestration
    "training_engine",
    # 2 — engines
    "tuner : hpo : trainer : trainer_artifact : trainer_data : trainer_feature_selection : trainer_params : trainer_quick : trainer_scoring : trainer_state : explain",
    # 1 — ML building blocks
    "models : outliers_presets : preprocessing_presets : preprocessing : oversampling : validation : feature_selection : isotonic : experiment",
    # 0 — shared utilities
    "common",
    # Generated by setuptools-scm at install time.
    "(_version)",
]

[[tool.importlinter.contracts]]
id = "hpo-independent-of-trainer"
name = "HPO does not import the trainer modules"
type = "forbidden"
source_modules = ["configurable_automl_engine.hpo"]
forbidden_modules = [
    "configurable_automl_engine.trainer",
    "configurable_automl_engine.trainer_artifact",
    "configurable_automl_engine.trainer_data",
    "configurable_automl_engine.trainer_feature_selection",
    "configurable_automl_engine.trainer_params",
    "configurable_automl_engine.trainer_quick",
    "configurable_automl_engine.trainer_scoring",
    "configurable_automl_engine.trainer_state",
]

[[tool.importlinter.contracts]]
id = "trainer-independent-of-hpo"
name = "The trainer modules do not import HPO"
type = "forbidden"
source_modules = [
    "configurable_automl_engine.trainer",
    "configurable_automl_engine.trainer_artifact",
    "configurable_automl_engine.trainer_data",
    "configurable_automl_engine.trainer_feature_selection",
    "configurable_automl_engine.trainer_params",
    "configurable_automl_engine.trainer_quick",
    "configurable_automl_engine.trainer_scoring",
    "configurable_automl_engine.trainer_state",
]
forbidden_modules = [
    "configurable_automl_engine.hpo",
    "configurable_automl_engine.tuner",
]

[[tool.importlinter.contracts]]
id = "acyclic"
name = "No import cycles between sibling modules"
type = "acyclic_siblings"
ancestors = ["configurable_automl_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Model fields accessed via __fields__ / model_fields on an instance are deprecated:
    # __fields__ — PydanticDeprecatedSince20, instance-model_fields —
    # PydanticDeprecatedSince211
    "error::pydantic.warnings.PydanticDeprecatedSince20",
    "error::pydantic.warnings.PydanticDeprecatedSince211",
]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
concurrency = ["multiprocessing", "thread"]
# Covered workers start with forkserver/spawn and import the main module again:
# patch them so their coverage data is collected as well.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
