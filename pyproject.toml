    [build-system]
    requires = ["setuptools>=64","setuptools-scm>=8", "wheel"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "configurable-automl-engine"              # PyPI name (may differ from the module name)
    dynamic = ["version"]
    description = "A configuration-driven AutoML orchestrator for tabular regression: automated model selection and multi-step hyperparameter optimization."
    readme = "README.md"
    license = "BSD-3-Clause"
    authors = [
    { name = "Leonid Lapshin", email = "leonid.lapshin.a@gmail.com" }
    ]
    requires-python = ">=3.11"
    dependencies = [
        "numpy>=2.4.2",
        "pandas>=3.0.0",
        "imbalanced-learn>=0.14.1",
        "scikit-learn>=1.8.0",
        "joblib>=1.5.3",
        "pyyaml>=6.0.3",
        "scipy>=1.17.0",
        "optuna>=4.7.0",
        "pydantic>=2.12.5",
        "pyarrow>=23.0.0",
    ]
    classifiers = [
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Operating System :: OS Independent",
        "Typing :: Typed",
        "Intended Audience :: Science/Research",
        "Intended Audience :: Developers",
        "Development Status :: 4 - Beta",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
        "Topic :: Software Development :: Libraries :: Python Modules",
    ]
    keywords = [ 
        "machine-learning", 
        "data-science", 
        "data-analysis"
    ]

    [project.optional-dependencies]

    xgboost = ["xgboost>=3.1.3"]

    # Logging with multithreading support
    logging = ["concurrent-log-handler>=0.9.25"]

    test = ["pytest>=9.0.2", "pytest-mock>=3.14.0", "import-linter==2.15"]

    all = ["configurable-automl-engine[xgboost,logging]"]

    dev = ["configurable-automl-engine[all,test]"]

    [project.urls]
    Homepage = "https://github.com/LapshinLeonid/configurable_automl_engine"
    Issues = "https://github.com/LapshinLeonid/configurable_automl_engine/issues"

    [tool.setuptools_scm]
    local_scheme = "no-local-version"
    write_to = "src/configurable_automl_engine/_version.py"

    [tool.setuptools.package-data]
    configurable_automl_engine = ["py.typed"]

    # Explicit Ruff settings: without a project config Ruff falls back to the
    # user-level ruff.toml, so `ruff format --check` results depended on the
    # machine it ran on.
    [tool.ruff]
    line-length = 88
    target-version = "py311"
    # Generated by setuptools-scm at install time (single-quoted strings).
    extend-exclude = ["src/configurable_automl_engine/_version.py"]

    # Cyclomatic complexity cap (ruff C901). New functions must stay at or
    # below the limit; the remaining ``# noqa: C901`` markers are tracked as
    # separate refactoring issues.
    [tool.ruff.lint]
    extend-select = ["C901"]

    [tool.ruff.lint.mccabe]
    max-complexity = 15

    [tool.ruff.format]
    quote-style = "double"
    indent-style = "space"
    line-ending = "auto"

    [tool.mypy]

    [[tool.mypy.overrides]]
    module = [
        "sklearn.*",
        "joblib.*",
        "imblearn",
        "imblearn.*",
        "concurrent_log_handler.*",
    ]
    ignore_missing_imports = true

    # Import layers (enforced in CI by ``lint-imports``). Each layer may import
    # only from itself and from the layers below it — top-level, function-level
    # and TYPE_CHECKING imports alike. If a lower module needs something from
    # above, move that thing down. No allowlist (``ignore_imports``) is used.
    [tool.importlinter]
    root_package = "configurable_automl_engine"
    # Count TYPE_CHECKING imports too (the default, stated explicitly).
    exclude_type_checking_imports = false

    [[tool.importlinter.contracts]]
    id = "layers"
    name = "Layers: training_engine -> engines -> building blocks -> common"
    type = "layers"
    containers = ["configurable_automl_engine"]
    # Every module of the package must be assigned to a layer.
    exhaustive = true
    layers = [
        # 3 — orchestration
        "training_engine",
        # 2 — engines
        "tuner : hpo : trainer : trainer_artifact : trainer_data : trainer_feature_selection : trainer_params : trainer_scoring : trainer_state",
        # 1 — ML building blocks
        "models : preprocessing_presets : preprocessing : oversampling : validation : feature_selection : isotonic",
        # 0 — shared utilities
        "common",
        # Generated by setuptools-scm at install time.
        "(_version)",
    ]

    [[tool.importlinter.contracts]]
    id = "hpo-independent-of-trainer"
    name = "HPO does not import the trainer modules"
    type = "forbidden"
    source_modules = ["configurable_automl_engine.hpo"]
    forbidden_modules = [
        "configurable_automl_engine.trainer",
        "configurable_automl_engine.trainer_artifact",
        "configurable_automl_engine.trainer_data",
        "configurable_automl_engine.trainer_feature_selection",
        "configurable_automl_engine.trainer_params",
        "configurable_automl_engine.trainer_scoring",
        "configurable_automl_engine.trainer_state",
    ]

    [[tool.importlinter.contracts]]
    id = "trainer-independent-of-hpo"
    name = "The trainer modules do not import HPO"
    type = "forbidden"
    source_modules = [
        "configurable_automl_engine.trainer",
        "configurable_automl_engine.trainer_artifact",
        "configurable_automl_engine.trainer_data",
        "configurable_automl_engine.trainer_feature_selection",
        "configurable_automl_engine.trainer_params",
        "configurable_automl_engine.trainer_scoring",
        "configurable_automl_engine.trainer_state",
    ]
    forbidden_modules = [
        "configurable_automl_engine.hpo",
        "configurable_automl_engine.tuner",
    ]

    [[tool.importlinter.contracts]]
    id = "acyclic"
    name = "No import cycles between sibling modules"
    type = "acyclic_siblings"
    ancestors = ["configurable_automl_engine"]

    [tool.pytest.ini_options]
    filterwarnings = [
        # Model fields accessed via __fields__ / model_fields on an instance are deprecated:
        # __fields__ — PydanticDeprecatedSince20, instance-model_fields —
        # PydanticDeprecatedSince211
        "error::pydantic.warnings.PydanticDeprecatedSince20",
        "error::pydantic.warnings.PydanticDeprecatedSince211",
    ]