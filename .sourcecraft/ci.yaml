# .sourcecraft/ci.yaml

on:
  push:
    - workflows: [ai-development-pipeline]
      filter:
        branches: ["infrastructure-ci-only-do-not-delete"]
    - workflows: [sync-to-github]
      filter:
        branches: ["**"]

workflows:
  # ----------------------------------------------------
  # Синхронизация SourceCraft → GitHub
  # ----------------------------------------------------
  sync-to-github:
    tasks:
      - name: push-to-github
        cubes:
          - name: sync
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              GITHUB_REPO: "LapshinLeonid/configurable_automl_engine"
            script:
              - |
                set -e

                echo "🔍 Проверяем commit title на флаг пропуска..."
                COMMIT_TITLE=$(git log -1 --pretty=%s)
                if echo "$COMMIT_TITLE" | grep -q "\[skip-sync\]"; then
                  echo "⏭️ Commit title содержит [skip-sync], пропускаем синхронизацию в GitHub"
                  exit 0
                fi

                BRANCH="${SOURCECRAFT_COMMIT_REF_NAME}"
                echo "🔄 Синхронизируем ветку '$BRANCH' в GitHub..."

                git config user.name "SourceCraft Sync"
                git config user.email "noreply@sourcecraft.dev"

                # Добавляем GitHub как remote и пушим через HEAD (detached HEAD в CI/CD)
                git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
                git push github "HEAD:refs/heads/${BRANCH}"

                echo "✅ Ветка '$BRANCH' синхронизирована в GitHub"

  # ----------------------------------------------------
  # Единый пайплайн: планирование → код → ревью
  # ----------------------------------------------------
  ai-development-pipeline:
    inputs:
      issue_id:
        type: string
        required: true
        description: "Укажите ID (номер) задачи"

    tasks:
      - name: full-development-cycle
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        cubes:
          # Шаг 0: Установка CLI и настройка auth (один раз на всю задачу)
          - name: setup-cli
            script:
              - |
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Настройка аутентификации через SOURCECRAFT_TOKEN (неинтерактивно)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                # Сохраняем PATH для следующих кубов
                echo "export PATH=\"/root/sourcecraft/bin:\$PATH\"" >> ~/.bashrc

          # Шаг 1: Генерация архитектурного плана
          - name: generate-plan
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "Проанализируй задачу #$ISSUE_ID, составь архитектурный план реализации и сохрани его в файл plan.json"
            artifacts:
              paths:
                - plan.json

          # Шаг 2: Написание кода с использованием плана
          - name: execute-coding
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "Реализуй задачу #$ISSUE_ID используя архитектурный план из plan.json. Запусти тесты: poetry run ruff check . && poetry run pytest. При успехе закоммить изменения и создай Pull Request."

      # Шаг 3: Автоматическое ревью (отдельный task, т.к. нужен созданный PR)
      - name: automated-review
        needs:
          - full-development-cycle
        cubes:
          - name: run-review
            script:
              - |
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Настройка аутентификации через SOURCECRAFT_TOKEN (неинтерактивно)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                src codereview --autoinstall