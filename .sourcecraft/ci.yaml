# .sourcecraft/ci.yaml

on:
  push:
    - workflows: [ai-development-pipeline]
      filter:
        branches: ["infrastructure-ci-only-do-not-delete"]
    - workflows: [sync-to-github]
      filter:
        branches: ["main"]
    - workflows: [quality-checks]
      filter:
        branches: ["**"]

workflows:
  # ----------------------------------------------------
  # SourceCraft → GitHub synchronization
  # ----------------------------------------------------
  sync-to-github:
    tasks:
      - name: push-to-github
        cubes:
          - name: sync
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              GITHUB_REPO: "LapshinLeonid/configurable_automl_engine"
            script:
              - |
                set -e

                echo "🔍 Checking commit title for the skip flag..."
                COMMIT_TITLE=$(git log -1 --pretty=%s)
                if echo "$COMMIT_TITLE" | grep -q "\\[skip-sync\\]"; then
                  echo "⏭️ Commit title contains [skip-sync], skipping GitHub synchronization"
                  exit 0
                fi

                BRANCH="${SOURCECRAFT_COMMIT_REF_NAME}"
                echo "🔄 Syncing branch '$BRANCH' to GitHub..."

                git config user.name "SourceCraft Sync"
                git config user.email "noreply@sourcecraft.dev"

                # Strip whitespace and newlines from the token
                CLEAN_TOKEN=$(echo "${GITHUB_TOKEN}" | tr -d '\n\r ')

                # Add GitHub as a remote and push via HEAD (detached HEAD in CI/CD)
                git remote add github "https://x-access-token:${CLEAN_TOKEN}@github.com/${GITHUB_REPO}.git"
                git push github "HEAD:refs/heads/${BRANCH}"

                echo "✅ Branch '$BRANCH' synced to GitHub"

  # ----------------------------------------------------
  # Single pipeline: planning → coding → review → fixes → review → fixes
  # All steps in one task so that artifacts (pr_number.txt, review_output.txt)
  # are available between cubes.
  # ----------------------------------------------------
  ai-development-pipeline:
    inputs:
      issue_id:
        type: string
        required: true
        description: "Enter the issue ID (number)"

    tasks:
      - name: full-cycle
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        cubes:
          # Step 0: Install Python 3.11, project dependencies, the CLI, and configure auth
          - name: setup-cli
            script:
              - |
                set -e

                # Install Python 3.11
                echo "🐍 Installing Python 3.11..."
                apt-get update -qq
                apt-get install -y -qq software-properties-common
                add-apt-repository -y ppa:deadsnakes/ppa
                apt-get update -qq
                apt-get install -y -qq python3.11 python3.11-distutils python3.11-venv
                update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
                update-alternatives --set python3 /usr/bin/python3.11
                curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
                python3 --version

                # Install project dependencies from pyproject.toml
                echo "📦 Installing project dependencies..."
                python3 -m pip install --upgrade pip
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e ".[all,test]"

                # Install the SourceCraft CLI
                echo "🔧 Installing the SourceCraft CLI..."
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Configure authentication via SOURCECRAFT_TOKEN (non-interactive)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                # Save PATH for the following cubes 
                echo "export PATH=\"/root/sourcecraft/bin:\$PATH\"" >> ~/.bashrc

          # Step 1: Generate the architecture plan
          - name: generate-plan
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "Analyze issue #$ISSUE_ID, create an implementation architecture plan and save it to plan.json"
            artifacts:
              paths:
                - plan.json

          # Step 2: Write code using the plan
          - name: execute-coding
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "
                Implement issue #$ISSUE_ID using the architecture plan from plan.json.
                Strictly follow the standards and verification steps from AGENTS.md.

                After writing the code and tests and successfully passing all checks (ruff, mypy, pytest), commit the changes and create a Pull Request.
                
                After creating the PR, save its number to pr_number.txt (command: src pr list --json | grep -o '\"publicId\":[0-9]*' | head -1 | cut -d: -f2 > pr_number.txt).
                "
            artifacts:
              paths:
                - plan.json
                - pr_number.txt

          # --------------------------------------------------
          # Iteration 1: review → fixes
          # --------------------------------------------------

          # Step 3: First review
          - name: review-1
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -n "$PR_NUMBER" ]; then
                  echo "🔍 Iteration 1: running review for PR #$PR_NUMBER"
                  src pr checkout "$PR_NUMBER"
                  src codereview "$PR_NUMBER" --autoinstall 2>&1 | tee review_output.txt
                else
                  echo "⚠️ PR number not found, skipping review"
                  exit 1
                fi

                echo "Review #1 complete."
            artifacts:
              paths:
                - review_output.txt

          # Step 4: First fixes
          - name: fix-1
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -z "$PR_NUMBER" ]; then
                  echo "⚠️ PR number not found, skipping"
                  exit 0
                fi

                # Read the review output from review_output.txt
                echo "📋 Analyzing review results from review_output.txt..."
                if [ ! -f review_output.txt ]; then
                  echo "⚠️ review_output.txt not found. No fixes required."
                  exit 0
                fi

                REVIEW_CONTENT=$(cat review_output.txt)

                if [ -z "$REVIEW_CONTENT" ]; then
                  echo "✅ Review output is empty. No fixes required."
                  exit 0
                fi

                echo "📝 Iteration 1: passing review results to AI for analysis and fixing..."
                src pr checkout "$PR_NUMBER"


                # Get the PR branch name so fixes are pushed to it rather than to main
                PR_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                echo "🌿 PR branch: $PR_BRANCH"

                src do --autoinstall "
                Apply fixes to the code according to the following review comments:

                ${REVIEW_CONTENT}

                Follow the instructions from AGENTS.md (add tests if necessary, run ruff, mypy, pytest).
                After all checks pass, commit the changes and push them to the '${PR_BRANCH}' branch.
               
                === START OF REVIEW RESULT ===

                ${REVIEW_CONTENT}

                === END OF REVIEW RESULT ===
                "

          # --------------------------------------------------
          # Iteration 2: review → fixes
          # --------------------------------------------------

          # Step 5: Second review (verify that the fixes were applied)
          - name: review-2
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -n "$PR_NUMBER" ]; then
                  echo "🔍 Iteration 2: re-running review for PR #$PR_NUMBER"
                  src pr checkout "$PR_NUMBER"
                  src codereview "$PR_NUMBER" --autoinstall 2>&1 | tee review_output_2.txt
                else
                  echo "⚠️ PR number not found, skipping"
                  exit 1
                fi

                echo "Review #2 complete."
            artifacts:
              paths:
                - review_output_2.txt

          # Step 6: Second fixes (if the review is still not satisfied)
          - name: fix-2
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -z "$PR_NUMBER" ]; then
                  echo "⚠️ PR number not found, skipping"
                  exit 0
                fi

                # Read the review output from review_output_2.txt
                echo "📋 Analyzing review results from review_output_2.txt..."
                if [ ! -f review_output_2.txt ]; then
                  echo "⚠️ review_output_2.txt not found. No fixes required."
                  exit 0
                fi

                REVIEW_CONTENT=$(cat review_output_2.txt)

                if [ -z "$REVIEW_CONTENT" ]; then
                  echo "✅ Review output is empty. No fixes required."
                  exit 0
                fi

                echo "📝 Iteration 2: passing review results to AI for analysis and fixing..."
                src pr checkout "$PR_NUMBER"

                # Get the PR branch name so fixes are pushed to it rather than to main
                PR_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                echo "🌿 PR branch: $PR_BRANCH"

                src do --autoinstall "
                Apply fixes to the code according to the following review comments (final iteration):
                ${REVIEW_CONTENT}

                Follow the instructions from AGENTS.md (add tests if necessary, run ruff, mypy, pytest).
                After all checks pass, commit the changes and push them to the '${PR_BRANCH}' branch.
                "

  # ----------------------------------------------------
  # Apply review fixes (manual run)
  # ----------------------------------------------------
  apply-review-fixes:
    inputs:
      review_comments:
        type: string
        required: true
        description: "Text of the comments/fixes to apply to the code"

    tasks:
      - name: fix-and-push
        env:
          REVIEW_COMMENTS: ${{ inputs.review_comments }}
        cubes:
          - name: setup-cli
            script:
              - |
                set -e

                # Install Python 3.11
                echo "🐍 Installing Python 3.11..."
                apt-get update -qq
                apt-get install -y -qq software-properties-common
                add-apt-repository -y ppa:deadsnakes/ppa
                apt-get update -qq
                apt-get install -y -qq python3.11 python3.11-distutils python3.11-venv
                update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
                update-alternatives --set python3 /usr/bin/python3.11
                curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
                python3 --version

                # Install project dependencies from pyproject.toml
                echo "📦 Installing project dependencies..."
                python3 -m pip install --upgrade pip
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e ".[all,test]"

                # Install the SourceCraft CLI
                echo "🔧 Installing the SourceCraft CLI..."
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Configure authentication via SOURCECRAFT_TOKEN (non-interactive)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                # Save PATH for the following cubes 
                echo "export PATH=\"/root/sourcecraft/bin:\$PATH\"" >> ~/.bashrc

          - name: apply-fixes
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                # Get the current branch name (the PR branch the workflow is running on)
                echo "🌿 Current branch: ${SOURCECRAFT_COMMIT_REF_NAME}"

                src do --autoinstall "
                Apply fixes to the code according to the following review comments:

                ${REVIEW_COMMENTS}

                Follow the instructions from AGENTS.md (add tests if necessary, run ruff, mypy, pytest).
                After all checks pass, commit the changes and push them to the '${SOURCECRAFT_COMMIT_REF_NAME}' branch.
                "

# ----------------------------------------------------
  # Run code quality checks on every push
  # ----------------------------------------------------
  quality-checks:
    tasks:
      - name: run-quality-checks
        cubes:
          - name: lint-and-test
            image: python:3.11-slim
            script:
              - pip install --upgrade pip
              - SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" pip install -e ".[all,test]"
              - pip install pytest pytest-cov pytest-mock ruff mypy types-PyYAML
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  1. CODE STYLE CHECK (Ruff)"
                echo "═══════════════════════════════════════════════════════════════"
                ruff check src/
                echo "✅ Ruff: no issues found"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  2. TYPE CHECK (Mypy)"
                echo "═══════════════════════════════════════════════════════════════"
                mypy src --install-types --non-interactive
                echo "✅ Mypy: no issues found"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  3. RUN TESTS AND COVERAGE (Pytest)"
                echo "═══════════════════════════════════════════════════════════════"
                pytest --cov=src