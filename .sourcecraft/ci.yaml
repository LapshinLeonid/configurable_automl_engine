# .sourcecraft/ci.yaml

on:
  push:
    - workflows: [ai-development-pipeline]
      filter:
        branches: ["infrastructure-ci-only-do-not-delete"]
    - workflows: [sync-to-github]
      filter:
        branches: ["main"]
    - workflows: [quality-checks]
      filter:
        branches: ["**"]
    - workflows: [publish-contracts]
      filter:
        tags: ["contracts-v*"]
    - workflows: [sync-to-github]
      filter:
        tags: ["contracts-v*"]

  pull_request:
    - workflows: [quality-checks]
      filter:
        target_branches: ["**"]

workflows:
  # ----------------------------------------------------
  # SourceCraft → GitHub synchronization
  # ----------------------------------------------------
  sync-to-github:
    tasks:
      - name: push-to-github
        cubes:
          - name: sync
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              GITHUB_REPO: "LapshinLeonid/configurable_automl_engine"
            script:
              - |
                set -e

                echo "🔍 Checking commit title for the skip flag..."
                COMMIT_TITLE=$(git log -1 --pretty=%s)
                if echo "$COMMIT_TITLE" | grep -q "\\[skip-sync\\]"; then
                  echo "⏭️ Commit title contains [skip-sync], skipping GitHub synchronization"
                  exit 0
                fi

                REF_NAME="${SOURCECRAFT_COMMIT_REF_NAME}"
                echo "🔄 Syncing '$REF_NAME' to GitHub..."

                git config user.name "SourceCraft Sync"
                git config user.email "noreply@sourcecraft.dev"

                # Strip whitespace and newlines from the token
                CLEAN_TOKEN=$(echo "${GITHUB_TOKEN}" | tr -d '\n\r ')

                # Add GitHub as a remote and push via HEAD (detached HEAD in CI/CD)
                git remote add github "https://x-access-token:${CLEAN_TOKEN}@github.com/${GITHUB_REPO}.git"
                if [ "${SOURCECRAFT_COMMIT_REF}" != "${SOURCECRAFT_COMMIT_REF#refs/tags/}" ]; then
                  git push github "HEAD:refs/tags/${REF_NAME}"
                  echo "✅ Tag '$REF_NAME' synced to GitHub"
                else
                  git push github "HEAD:refs/heads/${REF_NAME}"
                  echo "✅ Branch '$REF_NAME' synced to GitHub"
                fi

  # ----------------------------------------------------
  # Single pipeline: planning → coding → review → fixes → review → fixes
  # All steps in one task so that artifacts (pr_number.txt, review_output.txt)
  # are available between cubes.
  # ----------------------------------------------------
  ai-development-pipeline:
    inputs:
      issue_id:
        type: string
        required: true
        description: "Enter the issue ID (number)"

    tasks:
      - name: full-cycle
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        cubes:
          # Step 0: Install Python 3.11, project dependencies, the CLI, and configure auth
          - name: setup-cli
            script:
              - |
                set -e

                # Install Python 3.11
                echo "🐍 Installing Python 3.11..."
                bash scripts/setup_python311.sh
                python3 --version

                # Install project dependencies from pyproject.toml
                echo "📦 Installing project dependencies..."
                python3 -m pip install --upgrade pip
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e configurable-automl-contracts
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e ".[all,test]"

                # Install the SourceCraft CLI
                echo "🔧 Installing the SourceCraft CLI..."
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Configure authentication via SOURCECRAFT_TOKEN (non-interactive)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                # Save PATH for the following cubes 
                echo "export PATH=\"/root/sourcecraft/bin:\$PATH\"" >> ~/.bashrc

          # Step 1: Generate the architecture plan
          - name: generate-plan
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "Analyze issue #$ISSUE_ID, create an implementation architecture plan and save it to plan.json"
            artifacts:
              paths:
                - plan.json

          # Step 2: Write code using the plan
          - name: execute-coding
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "
                Implement issue #$ISSUE_ID using the architecture plan from plan.json.
                Strictly follow the standards and verification steps from AGENTS.md.

                After writing the code and tests and successfully passing all checks (ruff, mypy, pytest), commit the changes and create a Pull Request.
                
                After creating the PR, save its number to pr_number.txt (command: src pr list --json | grep -o '\"publicId\":[0-9]*' | head -1 | cut -d: -f2 > pr_number.txt).
                "
            artifacts:
              paths:
                - plan.json
                - pr_number.txt

          # --------------------------------------------------
          # Iteration 1: review → fixes
          # --------------------------------------------------

          # Step 3: First review
          - name: review-1
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -n "$PR_NUMBER" ]; then
                  echo "🔍 Iteration 1: running review for PR #$PR_NUMBER"
                  src pr checkout "$PR_NUMBER"
                  src codereview "$PR_NUMBER" --autoinstall 2>&1 | tee review_output.txt
                else
                  echo "⚠️ PR number not found, skipping review"
                  exit 1
                fi

                echo "Review #1 complete."
            artifacts:
              paths:
                - review_output.txt

          # Step 4: First fixes
          - name: fix-1
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -z "$PR_NUMBER" ]; then
                  echo "⚠️ PR number not found, skipping"
                  exit 0
                fi

                # Read the review output from review_output.txt
                echo "📋 Analyzing review results from review_output.txt..."
                if [ ! -f review_output.txt ]; then
                  echo "⚠️ review_output.txt not found. No fixes required."
                  exit 0
                fi

                REVIEW_CONTENT=$(cat review_output.txt)

                if [ -z "$REVIEW_CONTENT" ]; then
                  echo "✅ Review output is empty. No fixes required."
                  exit 0
                fi

                echo "📝 Iteration 1: passing review results to AI for analysis and fixing..."
                src pr checkout "$PR_NUMBER"


                # Get the PR branch name so fixes are pushed to it rather than to main
                PR_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                echo "🌿 PR branch: $PR_BRANCH"

                src do --autoinstall "
                Apply fixes to the code according to the following review comments:

                ${REVIEW_CONTENT}

                Follow the instructions from AGENTS.md (add tests if necessary, run ruff, mypy, pytest).
                After all checks pass, commit the changes and push them to the '${PR_BRANCH}' branch.
               
                === START OF REVIEW RESULT ===

                ${REVIEW_CONTENT}

                === END OF REVIEW RESULT ===
                "

          # --------------------------------------------------
          # Iteration 2: review → fixes
          # --------------------------------------------------

          # Step 5: Second review (verify that the fixes were applied)
          - name: review-2
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -n "$PR_NUMBER" ]; then
                  echo "🔍 Iteration 2: re-running review for PR #$PR_NUMBER"
                  src pr checkout "$PR_NUMBER"
                  src codereview "$PR_NUMBER" --autoinstall 2>&1 | tee review_output_2.txt
                else
                  echo "⚠️ PR number not found, skipping"
                  exit 1
                fi

                echo "Review #2 complete."
            artifacts:
              paths:
                - review_output_2.txt

          # Step 6: Second fixes (if the review is still not satisfied)
          - name: fix-2
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -z "$PR_NUMBER" ]; then
                  echo "⚠️ PR number not found, skipping"
                  exit 0
                fi

                # Read the review output from review_output_2.txt
                echo "📋 Analyzing review results from review_output_2.txt..."
                if [ ! -f review_output_2.txt ]; then
                  echo "⚠️ review_output_2.txt not found. No fixes required."
                  exit 0
                fi

                REVIEW_CONTENT=$(cat review_output_2.txt)

                if [ -z "$REVIEW_CONTENT" ]; then
                  echo "✅ Review output is empty. No fixes required."
                  exit 0
                fi

                echo "📝 Iteration 2: passing review results to AI for analysis and fixing..."
                src pr checkout "$PR_NUMBER"

                # Get the PR branch name so fixes are pushed to it rather than to main
                PR_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                echo "🌿 PR branch: $PR_BRANCH"

                src do --autoinstall "
                Apply fixes to the code according to the following review comments (final iteration):
                ${REVIEW_CONTENT}

                Follow the instructions from AGENTS.md (add tests if necessary, run ruff, mypy, pytest).
                After all checks pass, commit the changes and push them to the '${PR_BRANCH}' branch.
                "

  # ----------------------------------------------------
  # Apply review fixes (manual run)
  # ----------------------------------------------------
  apply-review-fixes:
    inputs:
      review_comments:
        type: string
        required: true
        description: "Text of the comments/fixes to apply to the code"

    tasks:
      - name: fix-and-push
        env:
          REVIEW_COMMENTS: ${{ inputs.review_comments }}
        cubes:
          - name: setup-cli
            script:
              - |
                set -e

                # Install Python 3.11
                echo "🐍 Installing Python 3.11..."
                bash scripts/setup_python311.sh
                python3 --version

                # Install project dependencies from pyproject.toml
                echo "📦 Installing project dependencies..."
                python3 -m pip install --upgrade pip
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e configurable-automl-contracts
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e ".[all,test]"

                # Install the SourceCraft CLI
                echo "🔧 Installing the SourceCraft CLI..."
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Configure authentication via SOURCECRAFT_TOKEN (non-interactive)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                # Save PATH for the following cubes 
                echo "export PATH=\"/root/sourcecraft/bin:\$PATH\"" >> ~/.bashrc

          - name: apply-fixes
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                # Get the current branch name (the PR branch the workflow is running on)
                echo "🌿 Current branch: ${SOURCECRAFT_COMMIT_REF_NAME}"

                src do --autoinstall "
                Apply fixes to the code according to the following review comments:

                ${REVIEW_COMMENTS}

                Follow the instructions from AGENTS.md (add tests if necessary, run ruff, mypy, pytest).
                After all checks pass, commit the changes and push them to the '${SOURCECRAFT_COMMIT_REF_NAME}' branch.
                "

# ----------------------------------------------------
  # Run code quality checks on every push
  # ----------------------------------------------------
  quality-checks:
    tasks:
      - name: run-quality-checks
        cubes:
          # Native cubes share the worker environment within a task, so the
          # test cube reuses the dependencies installed by the first cube.
          # They also run as separate cubes: the platform limits a single
          # cube to 1200 seconds, so lint and tests get independent budgets.
          - name: lint-and-typecheck
            script:
              # The native worker ships Python 3.10, while the project
              # requires >=3.11 — the shared setup script installs 3.11
              # and retries transient PPA failures
              - |
                set -e
                bash scripts/setup_python311.sh
                python3.11 --version
                python3.11 -m pip install --upgrade pip
                # Pre-install distutils-managed system packages with
                # --ignore-installed, otherwise pip fails with
                # "Cannot uninstall blinker 1.4" during dependency setup
                python3.11 -m pip install --ignore-installed blinker
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3.11 -m pip install -e configurable-automl-contracts
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3.11 -m pip install -e ".[all,test]"
                python3.11 -m pip install ruff mypy types-PyYAML pytest-cov import-linter==2.15
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  1. CODE STYLE CHECK (Ruff)"
                echo "═══════════════════════════════════════════════════════════════"
                python3.11 -m ruff check src/ configurable-automl-contracts/src/
                python3.11 -m ruff format --check src/ configurable-automl-contracts/src/
                echo "✅ Ruff: no issues found"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  2. IMPORT LAYERS CHECK (import-linter)"
                echo "═══════════════════════════════════════════════════════════════"
                # `lint-imports` is the console script of import-linter; call
                # it via the 3.11 interpreter context (Scripts dir on PATH)
                python3.11 -c "import sys; from importlinter.cli import lint_imports; sys.exit(lint_imports())"
                (cd configurable-automl-contracts && python3.11 -c "import sys; from importlinter.cli import lint_imports; sys.exit(lint_imports())")
                echo "✅ Import layers: no violations found"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  3. TYPE CHECK (Mypy)"
                echo "═══════════════════════════════════════════════════════════════"
                python3.11 -m mypy src --install-types --non-interactive
                (cd configurable-automl-contracts && python3.11 -m mypy src)
                echo "✅ Mypy: no issues found"

          - name: run-tests
            script:
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  4. RUN TESTS AND COVERAGE (Pytest)"
                echo "═══════════════════════════════════════════════════════════════"
                export AUTOML_RUN_NETWORK_TESTS=1
                python3.11 -m pytest --cov=src

          # The engine must work with the contract installed from the built
          # wheel, not only with the editable source checkout.
          - name: engine-contract-integration
            script:
              - |
                set -e
                python3.11 -m pip install build
                REPO_DIR="$(pwd)"
                VERSION=$(python3.11 -c "import tomllib; print(tomllib.load(open('configurable-automl-contracts/pyproject.toml', 'rb'))['project']['version'])")
                rm -rf configurable-automl-contracts/dist dist/engine
                python3.11 -m build configurable-automl-contracts --outdir configurable-automl-contracts/dist
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3.11 -m build . --outdir dist/engine
                CONTRACT_WHEEL=$(ls configurable-automl-contracts/dist/*.whl | head -1)
                ENGINE_WHEEL=$(ls dist/engine/*.whl | head -1)
                python3.11 -m pip install --force-reinstall --no-deps "$CONTRACT_WHEEL"
                python3.11 -m pip install --force-reinstall --no-deps "$ENGINE_WHEEL"
                (
                  cd /tmp
                  python3.11 "$REPO_DIR/scripts/smoke_engine_install.py" \
                    --expected-contract-version "$VERSION" \
                    --import-matrix "$REPO_DIR/tests/engine/golden/import_matrix.json" \
                    --forbid-source-root "$REPO_DIR"
                )
                echo "✅ Engine works with the built contract wheel and legacy public imports"

      # Independent contract gates: the contract is installed and tested
      # without the engine, built as its own distribution, and installed
      # into a clean virtual environment that must not contain the engine
      # or the heavy runtime packages.
      - name: contracts-guarantees
        cubes:
          - name: contracts-static-checks
            script:
              - |
                set -e
                bash scripts/setup_python311.sh
                python3.11 --version
                python3.11 -m pip install --upgrade pip
                python3.11 -m pip install --ignore-installed blinker
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3.11 -m pip install -e configurable-automl-contracts
                python3.11 -m pip install pytest pytest-mock ruff mypy types-PyYAML pyyaml import-linter==2.15 packaging
                python3.11 -m pip install --ignore-installed "jsonschema>=4.18"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  CONTRACT: STATIC BOUNDARY GUARDS"
                echo "═══════════════════════════════════════════════════════════════"
                python3.11 scripts/check_contract_boundaries.py
                python3.11 scripts/check_release_configuration.py
                echo "✅ Contract boundaries and release configuration: no violations found"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  CONTRACT: RUFF, MYPY, IMPORT-LINTER, PYTEST"
                echo "═══════════════════════════════════════════════════════════════"
                python3.11 -m ruff check src/ configurable-automl-contracts/src/
                python3.11 -m ruff format --check src/ configurable-automl-contracts/src/
                python3.11 -m ruff check tools/contract_boundaries.py tools/__init__.py scripts/check_contract_boundaries.py scripts/verify_contract_distribution.py scripts/smoke_contract_install.py scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py tests/contracts/test_architecture_guarantees.py tests/contracts/test_release_pipeline.py tests/contracts/test_release_configuration.py
                python3.11 -m ruff format --check tools/contract_boundaries.py tools/__init__.py scripts/check_contract_boundaries.py scripts/verify_contract_distribution.py scripts/smoke_contract_install.py scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py tests/contracts/test_architecture_guarantees.py tests/contracts/test_release_pipeline.py tests/contracts/test_release_configuration.py
                python3.11 -m mypy tools/contract_boundaries.py scripts/check_contract_boundaries.py scripts/verify_contract_distribution.py scripts/smoke_contract_install.py scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
                (cd configurable-automl-contracts && python3.11 -m mypy src)
                (cd configurable-automl-contracts && python3.11 -c "import sys; from importlinter.cli import lint_imports; sys.exit(lint_imports())")
                python3.11 -m pytest tests/contracts
                echo "✅ Contract quality checks: no issues found"

          - name: contracts-build-isolated
            script:
              - |
                set -e
                bash scripts/setup_python311.sh
                python3.11 --version
                python3.11 -m pip install --upgrade pip
                python3.11 -m pip install --ignore-installed blinker
                python3.11 -m pip install build twine
              - |
                set -e
                rm -rf configurable-automl-contracts/dist configurable-automl-contracts/build configurable-automl-contracts/src/*.egg-info
                python3.11 -m build configurable-automl-contracts --outdir configurable-automl-contracts/dist
                CONTRACT_WHEEL=$(ls configurable-automl-contracts/dist/*.whl | head -1)
                CONTRACT_SDIST=$(ls configurable-automl-contracts/dist/*.tar.gz | head -1)
                python3.11 -m twine check "$CONTRACT_WHEEL" "$CONTRACT_SDIST"
                python3.11 scripts/verify_contract_distribution.py \
                  --contract-wheel "$CONTRACT_WHEEL" \
                  --contract-sdist "$CONTRACT_SDIST"
                echo "✅ Contract wheel/sdist: metadata and contents are clean"
              - |
                set -e
                rm -rf /tmp/contracts-venv
                python3.11 -m venv /tmp/contracts-venv
                /tmp/contracts-venv/bin/pip install --upgrade pip
                CONTRACT_WHEEL=$(ls configurable-automl-contracts/dist/*.whl | head -1)
                /tmp/contracts-venv/bin/pip install "$CONTRACT_WHEEL"
                /tmp/contracts-venv/bin/python scripts/smoke_contract_install.py
                /tmp/contracts-venv/bin/pip check
                REPO_DIR="$(pwd)"
                VERSION=$(python3.11 -c "import tomllib; print(tomllib.load(open('configurable-automl-contracts/pyproject.toml', 'rb'))['project']['version'])")
                /tmp/contracts-venv/bin/pip install --index-url https://pypi.org/simple "jsonschema>=4.18" packaging
                (
                  cd /tmp
                  /tmp/contracts-venv/bin/python "$REPO_DIR/scripts/e2e_contract_consumer.py" \
                    --expected-version "$VERSION" \
                    --reference-config "$REPO_DIR/tests/contracts/data/reference_config.json" \
                    --forbid-source-root "$REPO_DIR"
                )
                echo "✅ Contract wheel: clean-environment install and consumer E2E passed"
              - |
                set -e
                rm -rf dist/engine
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3.11 -m build . --outdir dist/engine
                ENGINE_WHEEL=$(ls dist/engine/*.whl | head -1)
                ENGINE_SDIST=$(ls dist/engine/*.tar.gz | head -1)
                python3.11 scripts/verify_contract_distribution.py \
                  --engine-wheel "$ENGINE_WHEEL" \
                  --engine-sdist "$ENGINE_SDIST"
                echo "✅ Engine artifacts: contract sources are not included"

  # ----------------------------------------------------
  # Mirror configurable-automl-contracts to the SourceCraft PyPI registry
  #
  # Public PyPI is the canonical channel and is published by
  # .github/workflows/publish-contracts.yaml. This workflow keeps the
  # organization registry in sync for private consumers.
  #
  # Runs only for a contracts-v<version> tag. The workflow refuses to upload
  # when the tag and pyproject.toml disagree, when a quality gate fails, when
  # the registry variable is missing or when the PAT secret is absent. The
  # published package is then installed back from the registry and exercised
  # as an external consumer without the engine.
  # ----------------------------------------------------
  publish-contracts:
    env:
      # Set the identifier of the SourceCraft PyPI registry from its page.
      # The identifier is configuration, not a secret, and must not be
      # hardcoded in scripts.
      SOURCECRAFT_PYPI_REGISTRY_ID: "cn1v6bhb3a29dlbdd48d"
    tasks:
      - name: contracts-release
        cubes:
          - name: setup
            script:
              - |
                set -e
                bash scripts/setup_python311.sh
                python3.11 --version
                python3.11 -m pip install --upgrade pip
                python3.11 -m pip install --ignore-installed blinker
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3.11 -m pip install -e configurable-automl-contracts
                python3.11 -m pip install ruff mypy types-PyYAML pyyaml pytest pytest-mock pytest-cov import-linter==2.15 packaging build twine
                python3.11 -m pip install --ignore-installed "jsonschema>=4.18"

          - name: preflight
            script:
              - |
                set -e
                VERSION=$(python3.11 scripts/contract_release.py check-tag \
                  --ref "${SOURCECRAFT_COMMIT_REF}" \
                  --tag "${SOURCECRAFT_COMMIT_REF_NAME}" \
                  --pyproject configurable-automl-contracts/pyproject.toml)
                printf '%s' "$VERSION" > /tmp/contracts-release-version.txt
                echo "Release version: $VERSION"
                test -n "${SOURCECRAFT_PYPI_REGISTRY_ID}" || {
                  echo "SOURCECRAFT_PYPI_REGISTRY_ID is not configured" >&2
                  exit 1
                }
                python3.11 scripts/contract_release.py show-endpoints
                echo "✅ Release tag and registry configuration verified"

          - name: quality-gates
            script:
              - |
                set -e
                echo "═══════════════════════════════════════════════════════════════"
                echo "  RELEASE GATES: boundaries, release config, ruff, mypy, pytest"
                echo "═══════════════════════════════════════════════════════════════"
                python3.11 scripts/check_contract_boundaries.py
                python3.11 scripts/check_release_configuration.py
                python3.11 -m ruff check src/ configurable-automl-contracts/src/
                python3.11 -m ruff format --check src/ configurable-automl-contracts/src/
                python3.11 -m ruff check scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
                python3.11 -m ruff format --check scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
                python3.11 -m mypy scripts/contract_release.py scripts/check_release_configuration.py scripts/e2e_contract_consumer.py scripts/smoke_engine_install.py
                (cd configurable-automl-contracts && python3.11 -m mypy src)
                (cd configurable-automl-contracts && python3.11 -c "import sys; from importlinter.cli import lint_imports; sys.exit(lint_imports())")
                python3.11 -m pytest tests/contracts
                echo "✅ All release gates passed"

          - name: build-and-verify
            script:
              - |
                set -e
                VERSION=$(cat /tmp/contracts-release-version.txt)
                rm -rf configurable-automl-contracts/dist configurable-automl-contracts/build configurable-automl-contracts/src/*.egg-info
                python3.11 -m build configurable-automl-contracts --outdir configurable-automl-contracts/dist
                CONTRACT_WHEEL=$(ls configurable-automl-contracts/dist/*.whl | head -1)
                CONTRACT_SDIST=$(ls configurable-automl-contracts/dist/*.tar.gz | head -1)
                python3.11 -m twine check "$CONTRACT_WHEEL" "$CONTRACT_SDIST"
                python3.11 scripts/verify_contract_distribution.py \
                  --contract-wheel "$CONTRACT_WHEEL" \
                  --contract-sdist "$CONTRACT_SDIST" \
                  --expected-version "$VERSION"
                echo "✅ Distribution metadata and contents are clean"
              - |
                set -e
                VERSION=$(cat /tmp/contracts-release-version.txt)
                REPO_DIR="$(pwd)"
                rm -rf /tmp/publish-venv /tmp/publish-consumer
                python3.11 -m venv /tmp/publish-venv
                /tmp/publish-venv/bin/pip install --upgrade pip
                /tmp/publish-venv/bin/pip install --index-url https://pypi.org/simple "pydantic>=2.12.5,<3" "pydantic-core>=2,<3" "jsonschema>=4.18"
                CONTRACT_WHEEL=$(ls configurable-automl-contracts/dist/*.whl | head -1)
                /tmp/publish-venv/bin/pip install --no-deps "$CONTRACT_WHEEL"
                /tmp/publish-venv/bin/python scripts/smoke_contract_install.py
                /tmp/publish-venv/bin/pip check
                mkdir -p /tmp/publish-consumer
                (
                  cd /tmp/publish-consumer
                  /tmp/publish-venv/bin/python "$REPO_DIR/scripts/e2e_contract_consumer.py" \
                    --expected-version "$VERSION" \
                    --reference-config "$REPO_DIR/tests/contracts/data/reference_config.json" \
                    --forbid-source-root "$REPO_DIR"
                )
                echo "✅ The exact artifact that will be uploaded installs and serves a consumer"

          - name: publish
            env:
              PYPI_REGISTRY_PAT: ${{ secrets.PYPI_REGISTRY_PAT }}
            script:
              - |
                set -e
                VERSION=$(cat /tmp/contracts-release-version.txt)
                python3.11 scripts/contract_release.py check-tag \
                  --ref "${SOURCECRAFT_COMMIT_REF}" \
                  --tag "${SOURCECRAFT_COMMIT_REF_NAME}" \
                  --pyproject configurable-automl-contracts/pyproject.toml
                python3.11 scripts/contract_release.py publish \
                  --dist configurable-automl-contracts/dist \
                  --expected-version "$VERSION"
                echo "✅ Published configurable-automl-contracts $VERSION"

          - name: verify-from-registry
            env:
              PYPI_REGISTRY_PAT: ${{ secrets.PYPI_REGISTRY_PAT }}
            script:
              - |
                set -e
                VERSION=$(cat /tmp/contracts-release-version.txt)
                REPO_DIR="$(pwd)"
                rm -rf /tmp/contract-e2e-venv /tmp/contract-e2e-consumer
                python3.11 -m venv /tmp/contract-e2e-venv
                python3.11 scripts/contract_release.py install \
                  --python /tmp/contract-e2e-venv/bin/python \
                  --version "$VERSION" \
                  --with-jsonschema
                mkdir -p /tmp/contract-e2e-consumer
                (
                  cd /tmp/contract-e2e-consumer
                  /tmp/contract-e2e-venv/bin/python "$REPO_DIR/scripts/e2e_contract_consumer.py" \
                    --expected-version "$VERSION" \
                    --reference-config "$REPO_DIR/tests/contracts/data/reference_config.json" \
                    --forbid-source-root "$REPO_DIR"
                )
                echo "✅ Consumer E2E from the SourceCraft registry passed"
