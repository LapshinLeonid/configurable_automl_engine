# .sourcecraft/ci.yaml

on:
  push:
    - workflows: [ai-development-pipeline]
      filter:
        branches: ["infrastructure-ci-only-do-not-delete"]
    - workflows: [sync-to-github]
      filter:
        branches: ["main"]
    - workflows: [quality-checks]
      filter:
        branches: ["**"]

workflows:
  # ----------------------------------------------------
  # Синхронизация SourceCraft → GitHub
  # ----------------------------------------------------
  sync-to-github:
    tasks:
      - name: push-to-github
        cubes:
          - name: sync
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              GITHUB_REPO: "LapshinLeonid/configurable_automl_engine"
            script:
              - |
                set -e

                echo "🔍 Проверяем commit title на флаг пропуска..."
                COMMIT_TITLE=$(git log -1 --pretty=%s)
                if echo "$COMMIT_TITLE" | grep -q "\\[skip-sync\\]"; then
                  echo "⏭️ Commit title содержит [skip-sync], пропускаем синхронизацию в GitHub"
                  exit 0
                fi

                BRANCH="${SOURCECRAFT_COMMIT_REF_NAME}"
                echo "🔄 Синхронизируем ветку '$BRANCH' в GitHub..."

                git config user.name "SourceCraft Sync"
                git config user.email "noreply@sourcecraft.dev"

                # Очищаем токен от возможных пробелов и переносов строк
                CLEAN_TOKEN=$(echo "${GITHUB_TOKEN}" | tr -d '\n\r ')

                # Добавляем GitHub как remote и пушим через HEAD (detached HEAD в CI/CD)
                git remote add github "https://x-access-token:${CLEAN_TOKEN}@github.com/${GITHUB_REPO}.git"
                git push github "HEAD:refs/heads/${BRANCH}"

                echo "✅ Ветка '$BRANCH' синхронизирована в GitHub"

  # ----------------------------------------------------
  # Единый пайплайн: планирование → код → ревью → правки → ревью → правки
  # Все шаги в одном task, чтобы артефакты (pr_number.txt, review_output.txt)
  # были доступны между кубами.
  # ----------------------------------------------------
  ai-development-pipeline:
    inputs:
      issue_id:
        type: string
        required: true
        description: "Укажите ID (номер) задачи"

    tasks:
      - name: full-cycle
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
        cubes:
          # Шаг 0: Установка Python 3.11, зависимостей проекта, CLI и настройка auth
          - name: setup-cli
            script:
              - |
                set -e

                # Установка Python 3.11
                echo "🐍 Устанавливаем Python 3.11..."
                apt-get update -qq
                apt-get install -y -qq software-properties-common
                add-apt-repository -y ppa:deadsnakes/ppa
                apt-get update -qq
                apt-get install -y -qq python3.11 python3.11-distutils python3.11-venv
                update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
                update-alternatives --set python3 /usr/bin/python3.11
                curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
                python3 --version

                # Установка зависимостей проекта из pyproject.toml
                echo "📦 Устанавливаем зависимости проекта..."
                python3 -m pip install --upgrade pip
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e ".[all,test]"

                # Установка SourceCraft CLI
                echo "🔧 Устанавливаем SourceCraft CLI..."
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Настройка аутентификации через SOURCECRAFT_TOKEN (неинтерактивно)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                # Сохраняем PATH для следующих кубов
                echo "export PATH=\"/root/sourcecraft/bin:\$PATH\"" >> ~/.bashrc

          # Шаг 1: Генерация архитектурного плана
          - name: generate-plan
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "Проанализируй задачу #$ISSUE_ID, составь архитектурный план реализации и сохрани его в файл plan.json"
            artifacts:
              paths:
                - plan.json

          # Шаг 2: Написание кода с использованием плана
          - name: execute-coding
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "
                Реализуй задачу #$ISSUE_ID, используя архитектурный план из plan.json.
                Строго следуй стандартам и шагам проверки из AGENTS.md.

                После написания кода, тестов и успешного прохождения всех проверок (ruff, mypy, pytest) закоммить изменения и создай Pull Request.
                
                После создания PR сохрани его номер в файл pr_number.txt (командой: src pr list --json | grep -o '\"publicId\":[0-9]*' | head -1 | cut -d: -f2 > pr_number.txt).
                "
            artifacts:
              paths:
                - plan.json
                - pr_number.txt

          # --------------------------------------------------
          # Итерация 1: ревью → правки
          # --------------------------------------------------

          # Шаг 3: Первое ревью
          - name: review-1
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -n "$PR_NUMBER" ]; then
                  echo "🔍 Итерация 1: запускаем ревью для PR #$PR_NUMBER"
                  src pr checkout "$PR_NUMBER"
                  src codereview "$PR_NUMBER" --autoinstall 2>&1 | tee review_output.txt
                else
                  echo "⚠️ Номер PR не найден, пропускаем ревью"
                  exit 1
                fi

                echo "Ревью #1 завершено."
            artifacts:
              paths:
                - review_output.txt

          # Шаг 4: Первые правки
          - name: fix-1
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -z "$PR_NUMBER" ]; then
                  echo "⚠️ Номер PR не найден, пропускаем"
                  exit 0
                fi

                # Читаем вывод ревью из review_output.txt
                echo "📋 Анализируем результаты ревью из review_output.txt..."
                if [ ! -f review_output.txt ]; then
                  echo "⚠️ Файл review_output.txt не найден. Правки не требуются."
                  exit 0
                fi

                REVIEW_CONTENT=$(cat review_output.txt)

                if [ -z "$REVIEW_CONTENT" ]; then
                  echo "✅ Вывод ревью пуст. Правки не требуются."
                  exit 0
                fi

                echo "📝 Итерация 1: передаём результаты ревью AI для анализа и исправления..."
                src pr checkout "$PR_NUMBER"

                src do --autoinstall "
                Внеси исправления в код согласно следующим замечаниям ревью:

                ${REVIEW_CONTENT}

                Соблюдай инструкции из AGENTS.md (добавь тесты при необходимости, выполни ruff, mypy, pytest).
                При успешном прохождении всех проверок закоммить изменения и запуши их в ветку '${SOURCECRAFT_COMMIT_REF_NAME}'.
               
                === НАЧАЛО РЕЗУЛЬТАТА РЕВЬЮ ===

                ${REVIEW_CONTENT}

                === КОНЕЦ РЕЗУЛЬТАТА РЕВЬЮ ===
                "

          # --------------------------------------------------
          # Итерация 2: ревью → правки
          # --------------------------------------------------

          # Шаг 5: Второе ревью (проверяем, что правки применены)
          - name: review-2
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -n "$PR_NUMBER" ]; then
                  echo "🔍 Итерация 2: повторное ревью для PR #$PR_NUMBER"
                  src pr checkout "$PR_NUMBER"
                  src codereview "$PR_NUMBER" --autoinstall 2>&1 | tee review_output_2.txt
                else
                  echo "⚠️ Номер PR не найден, пропускаем"
                  exit 1
                fi

                echo "Ревью #2 завершено."
            artifacts:
              paths:
                - review_output_2.txt

          # Шаг 6: Вторые правки (если ревью всё ещё недовольно)
          - name: fix-2
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"

                PR_NUMBER=$(cat pr_number.txt 2>/dev/null || echo "")

                if [ -z "$PR_NUMBER" ]; then
                  echo "⚠️ Номер PR не найден, пропускаем"
                  exit 0
                fi

                # Читаем вывод ревью из review_output_2.txt
                echo "📋 Анализируем результаты ревью из review_output_2.txt..."
                if [ ! -f review_output_2.txt ]; then
                  echo "⚠️ Файл review_output_2.txt не найден. Правки не требуются."
                  exit 0
                fi

                REVIEW_CONTENT=$(cat review_output_2.txt)

                if [ -z "$REVIEW_CONTENT" ]; then
                  echo "✅ Вывод ревью пуст. Правки не требуются."
                  exit 0
                fi

                echo "📝 Итерация 2: передаём результаты ревью AI для анализа и исправления..."
                src pr checkout "$PR_NUMBER"

                src do --autoinstall "
                Внеси исправления в код согласно следующим замечаниям ревью (финальная итерация):
                ${REVIEW_CONTENT}

                Соблюдай инструкции из AGENTS.md (добавь тесты при необходимости, выполни ruff, mypy, pytest).
                При успешном прохождении всех проверок закоммить изменения и запуши их в ветку '${SOURCECRAFT_COMMIT_REF_NAME}'.
                "

  # ----------------------------------------------------
  # Применение правок по ревью (ручной запуск)
  # ----------------------------------------------------
  apply-review-fixes:
    inputs:
      review_comments:
        type: string
        required: true
        description: "Текст замечаний/правок, которые нужно внести в код"

    tasks:
      - name: fix-and-push
        env:
          REVIEW_COMMENTS: ${{ inputs.review_comments }}
        cubes:
          - name: setup-cli
            script:
              - |
                set -e

                # Установка Python 3.11
                echo "🐍 Устанавливаем Python 3.11..."
                apt-get update -qq
                apt-get install -y -qq software-properties-common
                add-apt-repository -y ppa:deadsnakes/ppa
                apt-get update -qq
                apt-get install -y -qq python3.11 python3.11-distutils python3.11-venv
                update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
                update-alternatives --set python3 /usr/bin/python3.11
                curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
                python3 --version

                # Установка зависимостей проекта из pyproject.toml
                echo "📦 Устанавливаем зависимости проекта..."
                python3 -m pip install --upgrade pip
                SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" python3 -m pip install -e ".[all,test]"

                # Установка SourceCraft CLI
                echo "🔧 Устанавливаем SourceCraft CLI..."
                curl -fsSL https://s3.yandexcloud.net/sourcecraft-cli/install.sh | sh
                export PATH="/root/sourcecraft/bin:$PATH"

                # Настройка аутентификации через SOURCECRAFT_TOKEN (неинтерактивно)
                mkdir -p ~/.config/sourcecraft
                cat > ~/.config/sourcecraft/config.yaml << EOF
                auth: "${SOURCECRAFT_TOKEN}"
                storage: filesystem
                EOF

                # Сохраняем PATH для следующих кубов
                echo "export PATH=\"/root/sourcecraft/bin:\$PATH\"" >> ~/.bashrc

          - name: apply-fixes
            script:
              - |
                export PATH="/root/sourcecraft/bin:$PATH"
                src do --autoinstall "
                Внеси исправления в код согласно следующим замечаниям ревью:

                ${REVIEW_COMMENTS}

                Соблюдай инструкции из AGENTS.md (добавь тесты при необходимости, выполни ruff, mypy, pytest).
                При успешном прохождении всех проверок закоммить изменения и запуши их в ветку '${SOURCECRAFT_COMMIT_REF_NAME}'.
                "

# ----------------------------------------------------
  # Проверка качества кода при каждом пуше
  # ----------------------------------------------------
  quality-checks:
    tasks:
      - name: run-quality-checks
        cubes:
          - name: lint-and-test
            image: python:3.11-slim
            script:
              - pip install --upgrade pip
              - SETUPTOOLS_SCM_PRETEND_VERSION="0.0.0" pip install -e ".[all,test]"
              - pip install pytest pytest-cov pytest-mock ruff mypy types-PyYAML
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  1. ПРОВЕРКА СТИЛЯ КОДА (Ruff)"
                echo "═══════════════════════════════════════════════════════════════"
                ruff check src/
                echo "✅ Ruff: замечаний нет"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  2. ПРОВЕРКА ТИПОВ (Mypy)"
                echo "═══════════════════════════════════════════════════════════════"
                mypy src --install-types --non-interactive
                echo "✅ Mypy: замечаний нет"
              - |
                echo ""
                echo "═══════════════════════════════════════════════════════════════"
                echo "  3. ЗАПУСК ТЕСТОВ И ПОКРЫТИЕ (Pytest)"
                echo "═══════════════════════════════════════════════════════════════"
                pytest --cov=src