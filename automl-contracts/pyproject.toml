[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-contracts"
version = "0.1.4"
description = "Public data contracts of the Configurable AutoML Engine."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Leonid Lapshin", email = "leonid.lapshin.a@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5,<3",
    "pydantic-core>=2,<3",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["automl", "contracts", "pydantic", "typing"]

[project.urls]
Homepage = "https://github.com/LapshinLeonid/configurable_automl_engine"
Issues = "https://github.com/LapshinLeonid/configurable_automl_engine/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["automl_contracts*"]

[tool.setuptools.package-data]
automl_contracts = ["py.typed", "schemas/*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true
packages = ["automl_contracts"]

[tool.importlinter]
root_package = "automl_contracts"
exclude_type_checking_imports = false
include_external_packages = true

[[tool.importlinter.contracts]]
id = "contract-must-not-import-engine"
name = "The contract never imports the engine"
type = "forbidden"
source_modules = ["automl_contracts"]
forbidden_modules = ["configurable_automl_engine"]

[[tool.importlinter.contracts]]
id = "contract-layers"
name = "Layers inside the contract"
type = "layers"
containers = ["automl_contracts"]
exhaustive = false
layers = [
    "config",
    "result : preprocessing : feature_selection : search_space",
    "metrics : custom_metrics : protocols",
    "definitions : errors",
]
